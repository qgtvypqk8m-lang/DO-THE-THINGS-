<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Dashboard & Habit Tracker</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e2e8f0;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 12px;
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h2, h3 {
            margin: 0;
            color: var(--text-primary);
        }

        h2 { font-size: 1.25rem; }
        h3 { font-size: 1.1rem; margin-top: 24px; margin-bottom: 12px; }

        .sync-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .table-responsive {
            overflow-x: auto;
            margin: 0 -16px;
            padding: 0 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 6px;
            text-align: center;
            font-size: 0.85rem;
        }

        th {
            background: #f8fafc;
            color: var(--text-secondary);
            font-weight: 600;
        }

        td:first-child {
            text-align: left;
            font-weight: 600;
            background: #f8fafc;
            padding-left: 10px;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .streak-badge {
            display: inline-block;
            font-size: 0.7rem;
            background: #ffedd5;
            color: #c2410c;
            padding: 2px 5px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: normal;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            background: #fff;
            display: inline-grid;
            place-content: center;
            transition: all 0.1s ease;
        }

        input[type="checkbox"]:checked {
            background: var(--success);
            border-color: var(--success);
        }

        input[type="checkbox"]:checked::before {
            content: "✓";
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .manager-section, .todo-section {
            margin-top: 24px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        input[type="text"], input[type="date"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            min-width: 140px;
        }

        input[type="text"]:focus, input[type="date"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.1s;
        }

        button:active {
            background: var(--accent-hover);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #f8fafc;
            margin-bottom: 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            gap: 10px;
        }

        .list-item-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .todo-due {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .delete-btn {
            background: #fee2e2;
            color: var(--danger);
            padding: 4px 10px;
            font-size: 0.75rem;
        }

        details {
            margin-top: 15px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        summary {
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        #loading {
            text-align: center;
            font-style: italic;
            color: var(--text-secondary);
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>Weekly Habit Tracker</h2>
        <div id="syncStatus" class="sync-status">Synced</div>
    </div>
    
    <div id="loading">Loading your data...</div>
    
    <!-- HABITS TABLE -->
    <div class="table-responsive">
        <table id="habitTable" style="display:none;">
            <thead>
                <tr id="tableHeader">
                    <th>Habit</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- TO-DO LIST SECTION -->
    <div class="todo-section">
        <h3>Weekly To-Do List</h3>
        <div class="input-group">
            <input type="text" id="newTodoTask" placeholder="Task name (e.g., Buy carrots)...">
            <input type="date" id="newTodoDate">
            <button onclick="addTodo()">Add Task</button>
        </div>
        
        <div id="todoListActive">
            <!-- Active Todos for the week -->
        </div>

        <details>
            <summary>Completed Tasks (<span id="completedCount">0</span>)</summary>
            <div id="todoListCompleted" style="margin-top: 10px;">
                <!-- Completed Todos dropdown list -->
            </div>
        </details>
    </div>

    <!-- HABIT MANAGER SECTION -->
    <div class="manager-section">
        <h3>Manage Habits</h3>
        <div class="input-group">
            <input type="text" id="newHabitName" placeholder="New habit name...">
            <button onclick="addHabit()">Add Habit</button>
        </div>
        <div id="habitListManager"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZPhqx83nxQ9AVeyj6XZhavlSP4H3fISfnIjjHTi9egtls8km71Xzhr33wKSeOpry4/exec';
    
    let habits = ["Drink Water", "Exercise", "Reading"];
    let logs = [];
    let todos = [];
    let currentWeekDates = [];

    function setupCurrentWeek() {
        const curr = new Date();
        const first = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1);
        
        currentWeekDates = [];
        for (let i = 0; i < 7; i++) {
            let nextDay = new Date(new Date().setDate(first + i));
            currentWeekDates.push({
                dateStr: nextDay.toISOString().split('T')[0],
                dayName: nextDay.toLocaleDateString('en-US', { weekday: 'short' }),
                shortDate: `${nextDay.getMonth() + 1}/${nextDay.getDate()}`
            });
        }
    }

    function fetchData() {
        const cachedHabits = localStorage.getItem('hb_habits');
        const cachedLogs = localStorage.getItem('hb_logs');
        const cachedTodos = localStorage.getItem('hb_todos');
        if (cachedHabits) habits = JSON.parse(cachedHabits);
        if (cachedLogs) logs = JSON.parse(cachedLogs);
        if (cachedTodos) todos = JSON.parse(cachedTodos);
        
        showUI();

        fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' })
            .then(res => res.json())
            .then(data => {
                if (data.habits && data.habits.length > 0) {
                    habits = data.habits;
                    localStorage.setItem('hb_habits', JSON.stringify(habits));
                }
                if (data.logs) {
                    logs = data.logs;
                    localStorage.setItem('hb_logs', JSON.stringify(logs));
                }
                if (data.todos) {
                    todos = data.todos;
                    localStorage.setItem('hb_todos', JSON.stringify(todos));
                }
                renderUI();
            })
            .catch(err => {
                console.log('Using offline cache:', err);
            });
    }

    function showUI() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('habitTable').style.display = 'table';
        renderUI();
    }

    function renderUI() {
        renderTable();
        renderManagerList();
        renderTodos();
    }

    // Check if a date string falls within the current Monday-Sunday window
    function isDateInCurrentWeek(dateStr) {
        if (!dateStr) return true; // If no due date, keep it visible in current week
        const startStr = currentWeekDates[0].dateStr;
        const endStr = currentWeekDates[6].dateStr;
        return dateStr >= startStr && dateStr <= endStr;
    }

    function renderTodos() {
        const activeDiv = document.getElementById('todoListActive');
        const completedDiv = document.getElementById('todoListCompleted');
        activeDiv.innerHTML = '';
        completedDiv.innerHTML = '';
        
        let completedCount = 0;
        let activeHtml = '';
        let completedHtml = '';

        todos.forEach(todo => {
            const isCompleted = todo.status === 'Completed';
            const belongsToCurrentWeek = isDateInCurrentWeek(todo.dueDate);

            if (isCompleted) {
                completedCount++;
                completedHtml += `
                    <div class="list-item">
                        <div class="list-item-content">
                            <input type="checkbox" checked onchange="toggleTodo(${todo.id}, this.checked)">
                            <span style="text-decoration: line-through; color: var(--text-secondary);">${todo.task}</span>
                            ${todo.dueDate ? `<span class="todo-due">${todo.dueDate}</span>` : ''}
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
                    </div>
                `;
            } else if (belongsToCurrentWeek) {
                activeHtml += `
                    <div class="list-item">
                        <div class="list-item-content">
                            <input type="checkbox" onchange="toggleTodo(${todo.id}, this.checked)">
                            <span>${todo.task}</span>
                            ${todo.dueDate ? `<span class="todo-due">${todo.dueDate}</span>` : ''}
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
                    </div>
                `;
            }
        });

        activeDiv.innerHTML = activeHtml || '<p style="font-size:0.85rem; color:var(--text-secondary); text-align:center; margin:10px 0;">No active tasks for this week.</p>';
        completedDiv.innerHTML = completedHtml || '<p style="font-size:0.85rem; color:var(--text-secondary); text-align:center; margin:5px 0;">No completed tasks.</p>';
        document.getElementById('completedCount').textContent = completedCount;
    }

    function calculateStreak(habitName) {
        let streak = 0;
        const today = new Date();
        for (let i = 0; i < 60; i++) {
            let d = new Date();
            d.setDate(today.getDate() - i);
            let dateStr = d.toISOString().split('T')[0];
            let log = logs.find(l => l.date === dateStr && l.habit === habitName);
            if (log && log.status === 'Done') {
                streak++;
            } else if (i === 0) {
                continue;
            } else {
                break;
            }
        }
        return streak;
    }

    function renderTable() {
        const headerRow = document.getElementById('tableHeader');
        headerRow.innerHTML = '<th>Habit</th>';
        currentWeekDates.forEach(d => {
            headerRow.innerHTML += `<th>${d.dayName}<br><span style="font-size:10px; font-weight:normal; color:#64748b;">${d.shortDate}</span></th>`;
        });

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        habits.forEach(habit => {
            const streak = calculateStreak(habit);
            let streakHtml = streak > 1 ? `<br><span class="streak-badge">🔥 ${streak} days</span>` : '';
            
            let row = `<tr><td>${habit}${streakHtml}</td>`;
            currentWeekDates.forEach(d => {
                const logMatch = logs.find(l => l.date === d.dateStr && l.habit === habit);
                const isChecked = logMatch && logMatch.status === 'Done' ? 'checked' : '';
                row += `<td><input type="checkbox" ${isChecked} onchange="toggleHabit('${habit}', '${d.dateStr}', this.checked)"></td>`;
            });
            row += `</tr>`;
            tbody.innerHTML += row;
        });
    }

    function renderManagerList() {
        const managerDiv = document.getElementById('habitListManager');
        managerDiv.innerHTML = '';
        habits.forEach((habit, index) => {
            managerDiv.innerHTML += `
                <div class="list-item">
                    <span>${habit}</span>
                    <button class="delete-btn" onclick="removeHabit(${index})">Delete</button>
                </div>
            `;
        });
    }

    function updateStatusText(text, isError = false) {
        const statusEl = document.getElementById('syncStatus');
        statusEl.textContent = text;
        statusEl.style.color = isError ? 'var(--danger)' : 'var(--text-secondary)';
    }

    function toggleHabit(habit, dateStr, isChecked) {
        const status = isChecked ? 'Done' : 'Missed';
        updateStatusText('Saving...');

        const existingIndex = logs.findIndex(l => l.date === dateStr && l.habit === habit);
        if (existingIndex >= 0) {
            logs[existingIndex].status = status;
        } else {
            logs.push({ date: dateStr, habit: habit, status: status });
        }
        localStorage.setItem('hb_logs', JSON.stringify(logs));
        renderTable();

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'saveLog', date: dateStr, habit: habit, status: status })
        })
        .then(() => updateStatusText('Synced'))
        .catch(() => updateStatusText('Sync failed', true));
    }

    function addTodo() {
        const taskInput = document.getElementById('newTodoTask');
        const dateInput = document.getElementById('newTodoDate');
        const task = taskInput.value.trim();
        const dueDate = dateInput.value;
        if (!task) return;

        const newTodo = { id: Date.now(), task: task, dueDate: dueDate, status: 'Pending' };
        todos.push(newTodo);
        taskInput.value = '';
        dateInput.value = '';
        localStorage.setItem('hb_todos', JSON.stringify(todos));
        renderTodos();
        updateStatusText('Syncing...');

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'addTodo', task: task, dueDate: dueDate })
        })
        .then(() => updateStatusText('Synced'))
        .catch(() => updateStatusText('Sync failed', true));
    }

    function toggleTodo(id, isChecked) {
        const status = isChecked ? 'Completed' : 'Pending';
        updateStatusText('Saving...');

        const todo = todos.find(t => t.id === id);
        if (todo) {
            todo.status = status;
        }
        localStorage.setItem('hb_todos', JSON.stringify(todos));
        renderTodos();

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'updateTodoStatus', id: id, status: status })
        })
        .then(() => updateStatusText('Synced'))
        .catch(() => updateStatusText('Sync failed', true));
    }

    function deleteTodo(id) {
        todos = todos.filter(t => t.id !== id);
        localStorage.setItem('hb_todos', JSON.stringify(todos));
        renderTodos();
        updateStatusText('Syncing...');

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'deleteTodo', id: id })
        })
        .then(() => updateStatusText('Synced'))
        .catch(() => updateStatusText('Sync failed', true));
    }

    function addHabit() {
        const input = document.getElementById('newHabitName');
        const val = input.value.trim();
        if (!val) return;
        
        habits.push(val);
        input.value = '';
        localStorage.setItem('hb_habits', JSON.stringify(habits));
        renderUI();
        syncHabitsToSheet();
    }

    function removeHabit(index) {
        habits.splice(index, 1);
        localStorage.setItem('hb_habits', JSON.stringify(habits));
        renderUI();
        syncHabitsToSheet();
    }

    function syncHabitsToSheet() {
        updateStatusText('Syncing...');
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'updateHabits', habits: habits })
        })
        .then(() => updateStatusText('Synced'))
        .catch(() => updateStatusText('Sync failed', true));
    }

    setupCurrentWeek();
    fetchData();
</script>

</body>
</html>
