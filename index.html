<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bi-Weekly Habit Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            @page {
                size: letter portrait;
                margin: 0;
            }
            body {
                background: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                padding: 0.2in !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: none !important;
            }
        }
        input[type="checkbox"] {
            accent-color: #1f2937;
            width: 1.15rem;
            height: 1.15rem;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-2 text-slate-900 font-sans flex flex-col items-center">

    <!-- Top Action Bar (Hidden on print) -->
    <div class="no-print w-full max-w-[8.5in] mb-2 flex flex-col sm:flex-row justify-between items-center bg-white p-2.5 rounded-lg shadow-xs border border-slate-200 gap-2">
        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start">
            <span class="font-bold text-slate-700 text-xs">Date Range / Title:</span>
            <input type="text" id="titleInput" value="P16 (AUG 03 - AUG 16)" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-500 font-medium w-40 sm:w-48" oninput="updateTitle(this.value)">
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
            <button onclick="clearData()" class="px-2.5 py-1 text-[11px] font-semibold bg-rose-50 text-rose-600 border border-rose-200 rounded hover:bg-rose-100 transition">Clear</button>
            <button onclick="window.print()" class="px-3 py-1 text-[11px] font-semibold bg-slate-800 text-white rounded hover:bg-slate-700 transition shadow-xs">Print / PDF</button>
        </div>
    </div>

    <!-- Main Printable Habit Tracker Sheet -->
    <div class="print-container w-full max-w-[8.5in] bg-white p-2.5 sm:p-5 rounded-xl shadow-md border border-slate-200 flex flex-col gap-3.5">
        
        <!-- Header -->
        <div class="flex justify-between items-end border-b border-slate-300 pb-1.5">
            <h1 class="text-xs sm:text-base font-bold text-slate-900 tracking-wide uppercase">** DO THE THINGS **</h1>
            <div id="subTitle" class="text-[11px] sm:text-xs text-slate-500 font-medium italic">P16 (AUG 03 - AUG 16)</div>
        </div>

        <!-- ================= WEEK 1 ================= -->
        <div class="flex flex-col border border-slate-300 rounded overflow-hidden bg-white shadow-2xs">
            <div class="bg-slate-800 text-white text-center font-bold text-[11px] py-1 tracking-wider">WEEK 1</div>
            
            <!-- Day Headers -->
            <div class="grid grid-cols-8 bg-slate-800 text-white text-[9px] sm:text-[10px] font-bold text-center border-t border-slate-700">
                <div class="p-1 flex items-center justify-center border-r border-slate-700 leading-tight">Habit</div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w1_d0" value="Mon Aug 03" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d0', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w1_d1" value="Tue Aug 04" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d1', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w1_d2" value="Wed Aug 05" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d2', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w1_d3" value="Thu Aug 06" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d3', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w1_d4" value="Fri Aug 07" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d4', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w1_d5" value="Sat Aug 08" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d5', this.value)"></div>
                <div class="p-1"><input type="text" id="w1_d6" value="Sun Aug 09" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w1_d6', this.value)"></div>
            </div>

            <!-- Reset Habits Rows -->
            <div id="w1-habits" class="divide-y divide-slate-200"></div>
        </div>

        <!-- ================= WEEK 2 ================= -->
        <div class="flex flex-col border border-slate-300 rounded overflow-hidden bg-white shadow-2xs">
            <div class="bg-slate-800 text-white text-center font-bold text-[11px] py-1 tracking-wider">WEEK 2</div>
            
            <!-- Day Headers -->
            <div class="grid grid-cols-8 bg-slate-800 text-white text-[9px] sm:text-[10px] font-bold text-center border-t border-slate-700">
                <div class="p-1 flex items-center justify-center border-r border-slate-700 leading-tight">Habit</div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w2_d0" value="Mon Aug 10" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d0', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w2_d1" value="Tue Aug 11" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d1', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w2_d2" value="Wed Aug 12" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d2', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w2_d3" value="Thu Aug 13" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d3', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w2_d4" value="Fri Aug 14" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d4', this.value)"></div>
                <div class="p-1 border-r border-slate-700"><input type="text" id="w2_d5" value="Sat Aug 15" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d5', this.value)"></div>
                <div class="p-1"><input type="text" id="w2_d6" value="Sun Aug 16" class="w-full bg-transparent text-center text-white focus:outline-none text-[8.5px] sm:text-[10px] font-bold" oninput="saveDate('w2_d6', this.value)"></div>
            </div>

            <!-- Reset Habits Rows -->
            <div id="w2-habits" class="divide-y divide-slate-200"></div>
        </div>

    </div>

    <script>
        const defaultHabits = ["Sink reset", "No screens", "Dog AM", "Dog PM", "Desk 30-min"];

        function updateTitle(val) {
            document.getElementById('subTitle').textContent = val;
            localStorage.setItem('tracker_title', val);
        }

        function saveDate(id, val) {
            localStorage.setItem(`tracker_date_${id}`, val);
        }

        function renderHabits(weekKey) {
            const container = document.getElementById(`${weekKey}-habits`);
            container.innerHTML = '';
            
            defaultHabits.forEach((defaultHabit, hIdx) => {
                let row = document.createElement('div');
                row.className = 'grid grid-cols-8 text-[11px] items-center bg-white';
                
                let labelContainer = document.createElement('div');
                labelContainer.className = 'p-1 font-bold text-slate-700 bg-slate-50 border-r border-slate-200 h-full flex items-center';
                
                let habitInput = document.createElement('input');
                habitInput.type = 'text';
                let habitKey = `tracker_${weekKey}_habit_name_${hIdx}`;
                habitInput.value = localStorage.getItem(habitKey) || defaultHabit;
                habitInput.className = 'w-full bg-transparent text-[10px] sm:text-[11px] font-bold text-slate-700 focus:outline-none text-center';
                habitInput.oninput = (e) => localStorage.setItem(habitKey, e.target.value);
                
                labelContainer.appendChild(habitInput);
                row.appendChild(labelContainer);

                for (let d = 0; d < 7; d++) {
                    let cell = document.createElement('div');
                    cell.className = 'p-1 flex justify-center items-center border-r border-slate-200 last:border-r-0 h-[32px] sm:h-[36px]';
                    
                    let checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    let storageKey = `tracker_${weekKey}_habit_${hIdx}_day_${d}`;
                    checkbox.checked = localStorage.getItem(storageKey) === 'true';
                    checkbox.onchange = (e) => localStorage.setItem(storageKey, e.target.checked);
                    
                    cell.appendChild(checkbox);
                    row.appendChild(cell);
                }
                container.appendChild(row);
            });
        }

        function clearData() {
            if (confirm("Clear all saved checks and custom text?")) {
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('tracker_')) {
                        localStorage.removeItem(key);
                    }
                });
                location.reload();
            }
        }

        // Load saved title
        const savedTitle = localStorage.getItem('tracker_title');
        if (savedTitle) {
            document.getElementById('titleInput').value = savedTitle;
            document.getElementById('subTitle').textContent = savedTitle;
        }

        // Load saved dates
        for (let w = 1; w <= 2; w++) {
            for (let d = 0; d < 7; d++) {
                let id = `w${w}_d${d}`;
                let savedDate = localStorage.getItem(`tracker_date_${id}`);
                if (savedDate !== null) {
                    document.getElementById(id).value = savedDate;
                }
            }
        }

        renderHabits('w1');
        renderHabits('w2');
    </script>
</body>
</html>
