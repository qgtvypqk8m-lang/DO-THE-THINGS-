<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit View</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        input[type="checkbox"] {
            accent-color: #0f172a;
            width: 1.35rem;
            height: 1.35rem;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 sm:p-6 font-sans flex flex-col items-center">

    <!-- Navigation Bar -->
    <div class="w-full max-w-lg mb-4 flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800 shadow-lg">
        <a href="index.html" class="px-3 py-1.5 text-xs font-bold bg-slate-800 text-indigo-400 rounded-lg hover:bg-slate-700 transition">📊 Bi-Weekly View</a>
        <span id="navDateDisplay" class="text-xs font-semibold text-slate-300">Today</span>
        <button onclick="resetToday()" class="px-3 py-1.5 text-xs font-bold bg-rose-500/20 text-rose-300 rounded-lg hover:bg-rose-500/35 transition">Reset Day</button>
    </div>

    <!-- Main Daily Card -->
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-5 flex flex-col gap-5">
        
        <!-- Date Changer Header -->
        <div class="flex justify-between items-center bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
            <button onclick="changeDay(-1)" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition">◀ Prev</button>
            <div class="flex flex-col items-center">
                <span id="dayHeaderTitle" class="text-sm font-extrabold text-indigo-400 uppercase tracking-wider">Today</span>
                <input type="date" id="datePicker" class="text-[11px] bg-transparent text-slate-400 text-center focus:outline-none cursor-pointer mt-0.5" onchange="selectDate(this.value)">
            </div>
            <button onclick="changeDay(1)" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-bold transition">Next ▶</button>
        </div>

        <!-- Habits Checklist for Selected Day -->
        <div class="flex flex-col gap-2">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Daily Reset Habits</h2>
            <div id="dailyHabitsContainer" class="flex flex-col gap-2.5">
                <!-- Populated dynamically -->
            </div>
        </div>

    </div>

    <script>
        const resetHabits = ["Sink reset", "No screens", "Dog AM", "Dog PM", "Desk 30-min"];
        let currentDate = new Date();

        function formatDateKey(date) {
            return date.toISOString().split('T')[0]; // e.g., "2026-08-05"
        }

        function updateView() {
            const dateStr = formatDateKey(currentDate);
            document.getElementById('datePicker').value = dateStr;
            
            // Format friendly title
            const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('dayHeaderTitle').textContent = currentDate.toLocaleDateString('en-US', options);

            const container = document.getElementById('dailyHabitsContainer');
            container.innerHTML = '';

            resetHabits.forEach((habit, hIdx) => {
                let storageKey = `daily_${dateStr}_habit_${hIdx}`;
                let isChecked = localStorage.getItem(storageKey) === 'true';

                let card = document.label = document.createElement('label');
                card.className = `flex items-center justify-between p-3.5 rounded-xl border transition cursor-pointer ${isChecked ? 'bg-indigo-950/40 border-indigo-500/50' : 'bg-slate-800/40 border-slate-700/50 hover:bg-slate-800'}`;

                card.innerHTML = `
                    <span class="font-bold text-sm text-slate-200">${habit}</span>
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleHabit(${hIdx}, this.checked)">
                `;
                container.appendChild(card);
            });
        }

        function toggleHabit(hIdx, checked) {
            const dateStr = formatDateKey(currentDate);
            let storageKey = `daily_${dateStr}_habit_${hIdx}`;
            localStorage.setItem(storageKey, checked);
            
            // Sync back to bi-weekly master tracker localStorage if dates overlap
            syncWithBiWeekly(currentDate, hIdx, checked);
            updateView();
        }

        function syncWithBiWeekly(date, hIdx, checked) {
            // Optional background sync logic if mapping to the Jan 5 2026 bi-weekly cycle
            let startDate = new Date(2026, 0, 5);
            let diffTime = date - startDate;
            let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays >= 0) {
                let periodIndex = Math.floor(diffDays / 14);
                let dayInPeriod = diffDays % 14;
                let weekKey = dayInPeriod < 7 ? 'w1' : 'w2';
                let dayIndex = dayInPeriod % 7;
                let pId = `P${String(periodIndex + 1).padStart(2, '0')}`;
                
                let biWeeklyKey = `tracker_${weekKey}_habit_${hIdx}_day_${dayIndex}`;
                localStorage.setItem(biWeeklyKey, checked);
            }
        }

        function changeDay(amount) {
            currentDate.setDate(currentDate.getDate() + amount);
            updateView();
        }

        function selectDate(val) {
            if (val) {
                currentDate = new Date(val + 'T00:00:00');
                updateView();
            }
        }

        function resetToday() {
            if (confirm("Reset all habits for this specific day?")) {
                const dateStr = formatDateKey(currentDate);
                resetHabits.forEach((_, hIdx) => {
                    localStorage.removeItem(`daily_${dateStr}_habit_${hIdx}`);
                });
                updateView();
            }
        }

        updateView();
    </script>
</body>
</html>
